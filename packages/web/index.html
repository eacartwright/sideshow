<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <script>
      // The theme before the first paint, so nothing flashes; src/theme.ts takes over after.
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("sideshow:theme"); } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e1116");
        // Overlay scrollbars (Windows 11's default in Firefox and Edge) take no room and ignore
        // scrollbar-gutter, so they draw over the content; scroll boxes then pad for them (styles.css).
        // Touch screens are left alone: their scrollbars are thin and fade.
        if (matchMedia("(pointer: fine)").matches) {
          var probe = document.createElement("div");
          probe.style.cssText = "position:absolute;top:-99px;width:50px;height:50px;overflow:scroll;scrollbar-gutter:stable";
          document.documentElement.appendChild(probe);
          if (probe.offsetWidth === probe.clientWidth) document.documentElement.dataset.scrollbars = "overlay";
          probe.remove();
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sideshow" />
    <!-- With credentials, or Cloudflare Access redirects the manifest request to its login. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The app's fonts: Unbounded for the header, Bricolage Grotesque for everything else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Unbounded:wght@400..800&display=swap"
    />
    <title>Sideshow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
